onboarding = false

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false
# One entry per data source, because the refresh interval belongs to the entry.
# Each entry stays silent on hosts that cannot read its source, and Herdr clears
# an entry with empty output, so every machine shows exactly one value.
tab_bar_right = [
  { type = "command", command = "~/.dotfiles/herdr/host-status.sh commandcode", interval_seconds = 60, timeout_seconds = 10 },
  { type = "command", command = "~/.dotfiles/herdr/host-status.sh power", interval_seconds = 2, timeout_seconds = 10 },
]

agent_panel_sort = "spaces"
[ui.toast]
# off = disable pop-up notifications
# herdr = show in-app toasts
# terminal = ask the outer terminal to show a desktop notification
# system = ask the OS notification service directly
#
# system 在 macOS 上先找 terminal-notifier，缺了就退回 /usr/bin/osascript，也就是
# AppleScript 那条路。osascript 发出的通知在通知中心显示为 Script Editor，图标与
# 行为都不对，点击也无法激活宿主终端。本机没装 terminal-notifier。
# 用 kitty 时选 terminal，通知由 kitty 自己发，点击时由 kitty 唤回窗口。
# 跳进 Herdr 内的 workspace/tab/pane 不靠点击通知，用 keys.open_notification_target。
#
# 已装 herdr-focus-notify 插件接管桌面通知（可点击并聚焦到具体 pane），故这里只留
# 应用内 toast，避免同一次状态变化收到两条通知。
delivery = "herdr"

[theme.custom]
# Make the active Space and focused Agent rows easier to distinguish.
active_row_bg = "#585b70"

[experimental]
kitty_graphics = true
reveal_hidden_cursor_for_cjk_ime = false
cjk_ime_agents = ["claude", "pi", "codex"]

[keys]
prefix = "ctrl+a"
split_horizontal = "prefix+d"
switch_tab = "ctrl+1..9"
switch_workspace = "alt+1..9"
next_workspace = "alt+tab"
previous_workspace = "alt+shift+tab"
# Free prefix+g for the lazygit popup. Default goto picker is prefix+g.
goto = ""
rename_tab = "prefix+r"
open_notification_target = ["ctrl+b", "prefix+o"]

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "osamahbeig.pane-mover.open"
description = "move this pane"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = 'exec "${SHELL:-sh}"'
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+i"
type = "shell"
command = 'printf "herdr pane id: %s" "$HERDR_ACTIVE_PANE_ID" | pbcopy'
description = "copy focused pane id"


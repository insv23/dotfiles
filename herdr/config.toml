onboarding = false

[ui.toast]
delivery = "terminal"

[theme.custom]
# Make the active workspace row easier to distinguish.
surface_dim = "#585b70"

[experimental]
kitty_graphics = true
reveal_hidden_cursor_for_cjk_ime = false
cjk_ime_agents = ["claude", "pi", "codex"]

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "osamahbeig.pane-mover.open"
description = "move this pane"
